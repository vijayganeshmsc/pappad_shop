<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account – Saravana & Co Papads</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8961e 0%, #f5881e 30%, #e65100 55%, #d94800 85%, #c1390f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
      padding: 40px 16px;
    }

    /* ── Top-left header ── */
    .site-header {
      position: absolute;
      top: 28px;
      left: 40px;
    }

    .site-header h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      font-weight: 900;
      color: #fdcb00;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .site-header p {
      color: #FFF3E0;
      font-size: 1rem;
      margin: 0;
    }

    /* ── Card wrapper ── */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: -48px;
      position: relative;
      z-index: 10;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F3722C, #F8961E);
      border: 3px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      cursor: default;
      transition: 0.3s;
    }

    .avatar:hover {
      background: linear-gradient(135deg, #F8961E, #F3722C);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .avatar-initial {
      font-size: 2.6rem;
      font-weight: 800;
      color: #b90404;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
    }

    /* ── Glass card ── */
    .card {
      background-color: rgba(255,165,100,0.22);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 72px 36px 36px;
    }

    /* ── Fields ── */
    .fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field-row {
      position: relative;
    }

    .field-row input {
      width: 100%;
      padding: 17px 52px 17px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .field-row input:focus {
      background: rgba(255,255,255,0.26);
      border-color: rgba(255,255,255,0.5);
    }

    .field-row input:disabled {
      cursor: default;
    }

    .field-row input:-webkit-autofill,
    .field-row input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
      -webkit-text-fill-color: #fff !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .edit-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      padding: 0;
      transition: color 0.2s;
    }

    .edit-btn:hover { color: #fff; }

    /* ── Save button ── */
    .btn-save {
      display: inline-block;
      width: 100%;
      padding: 14px;
      font-weight: 800;
      border-radius: 12px;
      border: none;
      font-size: 1.2rem;
      color: #b90404;
      background: linear-gradient(135deg, #F3722C, #F8961E);
      transition: 0.3s;
      margin-top: 12px;
      cursor: pointer;
    }

    .btn-save:hover {
      background: linear-gradient(135deg, #F8961E, #F3722C);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Top-left header -->
  <div class="site-header">
    <h1>Saravana &amp; Co Papads</h1>
    <p>Both retail and wholesale traders</p>
  </div>

  <!-- Card -->
  <div class="card-wrapper">

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar">
        <span class="avatar-initial" id="avatarInitial">V</span>
      </div>
    </div>

    <!-- Glass card -->
    <div class="card">
      <div class="fields">

        <div class="field-row">
          <input type="text" id="name" value="John Doe" disabled />
          <button class="edit-btn" onclick="enableField('name')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>

        <div class="field-row">
          <input type="tel" id="phone" value="9976123985" disabled />
          <button class="edit-btn" onclick="enableField('phone')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>

        <div class="field-row">
          <input type="text" id="address" value="jaihind puram" disabled />
          <button class="edit-btn" onclick="enableField('address')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>

        <div class="field-row">
          <input type="email" id="email" value="vijay@mail.com" disabled oninput="updateInitial(this.value)" />
          <button class="edit-btn" onclick="enableField('email')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>

      </div>

      <button class="btn-save" onclick="saveAll()">Save</button>
    </div>
  </div>

  <script>
    function enableField(id) {
      const input = document.getElementById(id);
      input.disabled = false;
      input.focus();
    }

    function updateInitial(value) {
      document.getElementById('avatarInitial').textContent =
        value ? value[0].toUpperCase() : '?';
    }

    function saveAll() {
      ['name','phone','address','email'].forEach(id => {
        document.getElementById(id).disabled = true;
      });
      alert('Profile updated successfully!');
    }
  </script>

</body>
</html>
