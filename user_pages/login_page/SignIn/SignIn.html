    <script>
      const inputs = document.querySelectorAll('.input-field .form-control');
     
      function checkInputValue(input) {
        if (input.value.trim() !== '') {
          input.classList.add('has-value');
        } else {
          input.classList.remove('has-value');
        }
      }
     
      inputs.forEach(input => {
        input.addEventListener('input', function() {
          checkInputValue(this);
        });
       
        input.addEventListener('change', function() {
          checkInputValue(this);
        });
       
        input.addEventListener('focus', function() {
          checkInputValue(this);
        });
       
        checkInputValue(input);
       
        setTimeout(() => {
          checkInputValue(input);
        }, 100);
      });
     
      window.addEventListener('load', function() {
        setTimeout(() => {
          inputs.forEach(input => {
            checkInputValue(input);
          });
        }, 200);
      });

      // Handle Sign In with Supabase
      document.getElementById('signInForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Prevent default form submission
        
        // Show loading state
        const signInBtn = document.querySelector('.btn-register');
        const originalText = signInBtn.textContent;
        signInBtn.textContent = 'Signing in...';
        signInBtn.disabled = true;
        
        // Get form values
        const email = document.getElementById('foremail').value;
        const password = document.getElementById('forpassword').value;
        
        try {
          // Sign in with Supabase
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
          
          if (error) {
            // Handle errors
            let errorMessage = 'Sign in failed. Please try again.';
            
            if (error.message.includes('Invalid login credentials')) {
              errorMessage = 'Invalid email or password. Please check and try again.';
            } else if (error.message.includes('Email not confirmed')) {
              errorMessage = 'Please verify your email address first.';
            } else if (error.message.includes('Too many requests')) {
              errorMessage = 'Too many failed attempts. Please try again later.';
            } else {
              errorMessage = error.message;
            }
            
            alert(errorMessage);
            console.error('Sign in error:', error);
          } else {
            // User signed in successfully
            const user = data.user;
            
            // Set login state in localStorage
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', user.email);
            localStorage.setItem('userName', user.user_metadata?.full_name || user.email.split('@')[0]);
            localStorage.setItem('userId', user.id);
            localStorage.setItem('supabaseSession', JSON.stringify(data.session));
            
            // Show success message
            alert('Sign in successful! Redirecting to home page...');
            
            // Redirect to Home Page
            window.location.href = '../../home_page/Home.html';
          }
        } catch (error) {
          alert('An unexpected error occurred. Please try again.');
          console.error('Unexpected error:', error);
        } finally {
          // Restore button state
          signInBtn.textContent = originalText;
          signInBtn.disabled = false;
        }
      });
    </script>
