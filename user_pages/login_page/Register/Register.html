<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saravana & Co Papads | Register</title>

    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
      crossorigin="anonymous"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="Register.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" 
      rel="stylesheet"
    >
  </head>

  <body>
    <div class="card">
      <h1>Saravana & Co Papads</h1>
      <p>Both retail and wholesale traders</p>

      <form id="registerForm">
        <!-- Name -->
        <div class="input-field mt-4">
          <input name="forname" id="forname" type="text" class="form-control fs-5" required >
          <label for="forname" class="form-label">Enter your name</label>
        </div>

        <!-- Phone -->
        <div class="input-field mb-3">
          <input 
            name="forphone" id="forphone" type="tel" 
            inputmode="numeric"
            pattern="[0-9]{10}" maxlength="10"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
            class="form-control fs-5" required
          >
          <label for="forphone" class="form-label">Phone number</label>
        </div>

        <!-- Address -->
        <div class="input-field mb-3">
          <input name="foraddress" id="foraddress" type="text" class="form-control fs-5" required>
          <label for="foraddress" class="form-label">Address</label>
        </div>
        <!-- Email -->
        <div class="input-field mb-3">
          <input name="foremail" id="foremail" type="email" class="form-control fs-5" required>
          <label for="foremail" class="form-label">Email</label>
        </div>

        <!-- Password -->
        <div class="input-field mb-3">
          <input name="forpassword" id="forpassword" type="password" class="form-control fs-5" required>
          <label for="forpassword" class="form-label">Password</label>
        </div>

        <!-- Button -->
        <div class="mb-4">
          <button type="submit" class="btn-register mt-3">Register</button>
        </div>

        <!-- Footer -->
        <div class="form-footer text-white">
          Already a member? <a href="/pappad_shop/user_pages/login_page/SignIn/SignIn.html">Sign In</a>
          <br>
          <a href="#" style="color: #fff; text-decoration: none;">Already have an account? Sign In instead</a>
        </div>
      </form>
    </div>

    <!-- JS: Floating Labels & Signup Logic -->
    <script>
      const inputs = document.querySelectorAll('.input-field .form-control');

      function checkInputValue(input) {
        if (input.value.trim() !== '') input.classList.add('has-value');
        else input.classList.remove('has-value');
      }

      inputs.forEach(input => {
        input.addEventListener('input', () => checkInputValue(input));
        input.addEventListener('change', () => checkInputValue(input));
        input.addEventListener('focus', () => checkInputValue(input));
        checkInputValue(input);
        setTimeout(() => checkInputValue(input), 100);
      });

      window.addEventListener('load', () => {
        setTimeout(() => {
          inputs.forEach(input => checkInputValue(input));
        }, 200);
      });

      // Handle Registration with Supabase
      document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Prevent default form submission
        
        // Show loading state
        const registerBtn = document.querySelector('.btn-register');
        const originalText = registerBtn.textContent;
        registerBtn.textContent = 'Registering...';
        registerBtn.disabled = true;
        
        // Get form values
        const name = document.getElementById('forname').value;
        const phone = document.getElementById('forphone').value;
        const address = document.getElementById('foraddress').value;
        const email = document.getElementById('foremail').value;
        const password = document.getElementById('forpassword').value;
        
        try {
          // Sign up with Supabase
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: name,
                phone: phone,
                address: address
              }
            }
          });
          
          if (error) {
            // Handle errors
            let errorMessage = 'Registration failed. Please try again.';
            
            if (error.message.includes('already registered')) {
              errorMessage = 'This email is already registered. Please sign in instead.';
            } else if (error.message.includes('password')) {
              errorMessage = 'Password should be at least 6 characters long.';
            } else if (error.message.includes('email')) {
              errorMessage = 'Please enter a valid email address.';
            } else {
              errorMessage = error.message;
            }
            
            alert(errorMessage);
            console.error('Registration error:', error);
          } else {
            // User created successfully
            const user = data.user;
            
            // Store additional user data in localStorage
            const userData = {
              id: user.id,
              name: name,
              phone: phone,
              address: address,
              email: email
            };
            localStorage.setItem('userData', JSON.stringify(userData));
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', name);
            localStorage.setItem('userId', user.id);
            
            if (data.session) {
              localStorage.setItem('supabaseSession', JSON.stringify(data.session));
            }
            
            // Show success message
            alert('Registration successful! Redirecting to home page...');
            
            // Redirect to Home Page
            window.location.href = '../../home_page/Home.html';
          }
        } catch (error) {
          alert('An unexpected error occurred. Please try again.');
          console.error('Unexpected error:', error);
        } finally {
          // Restore button state
          registerBtn.textContent = originalText;
          registerBtn.disabled = false;
        }
      });
    </script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Configuration -->
    <script src="../supabase-config.js"></script>

    <!-- Bootstrap JS -->
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous">
    </script>
  </body>
</html>
