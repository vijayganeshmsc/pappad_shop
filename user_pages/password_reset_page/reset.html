<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — Saravana & Co</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      body { background: #fff8e1; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
      .card { max-width:420px; margin:6vh auto; padding:2rem; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.06); background: #fff; }
      h1 { font-size:1.6rem; margin-bottom:.25rem; color:#e65100; }
      p { color:#6b4a00; margin-bottom:1rem; }
      .btn-yellow { background: #ffca28; color:#2b2b2b; border:0; padding:.6rem 1.1rem; border-radius:999px; font-weight:700; }
      .link-yellow { color:#ffca28; text-decoration:none; }
      .form-footer { margin-top:1rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Reset your password</h1>
      <p>Enter the email address associated with your account. We'll send a password reset link.</p>

      <form id="resetForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input id="email" name="email" type="email" class="form-control" required>
        </div>
        <div class="d-grid">
          <button class="btn-yellow" type="submit">Send reset email</button>
        </div>
        <div class="form-footer">
          Back to <a href="../login_page/SignIn/SignIn.html">Sign In</a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../login_page/supabase-config.js"></script>
    <script>
      document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type=submit]');
        const original = btn.textContent;
        btn.textContent = 'Sending...';
        btn.disabled = true;

        const email = document.getElementById('email').value;
        try {
          if (!window.supabaseClient) throw new Error('Supabase not configured');

          // Attempt to send reset email using Supabase
          const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/user_pages/login_page/SignIn/SignIn.html'
          });

          if (error) {
            console.error('Reset error:', error);
            alert(error.message || 'Unable to send reset email.');
          } else {
            alert('If an account exists for that email, a reset link has been sent.');
            window.location.href = '../home_page/Home.html';
          }
        } catch (err) {
          console.error(err);
          alert('Unable to send reset email. Please contact support.');
        } finally {
          btn.textContent = original;
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
